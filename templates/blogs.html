{% extends "base.html" %}
{% block title %}Blogs - Bell Recruitment | Recruitment and Field Marketing | Belfast{% endblock %}
{% block content %}

<section class="page-hero">
  <h1>Blogs</h1>
</section>

<section class="section">
  <div class="container">
    <div class="blog-grid">
      {% for post in posts %}
      <div class="blog-card">
        <img src="{{ url_for('static', filename='img/' + post.image) }}" alt="{{ post.title }}">
        <div class="body">
          <h3>{{ post.title }}</h3>
          <p>{{ post.excerpt }}</p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

{% endblock %}
